name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature matrix
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features blocking
          cargo check --no-default-features --features async
          cargo check --all-features
      - name: Tests
        run: cargo test --all-features --all-targets
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Embedded target
        run: cargo check --all-features --target thumbv7em-none-eabi
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps
      - name: Package contents
        run: cargo package --allow-dirty

  bosch-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Lint test-only reference bridges
        run: cargo clippy --manifest-path tests/reference-oracle/Cargo.toml --all-targets -- -D warnings
      - name: Bosch v4.4.8 fixed-point differential oracle
        run: cargo run --release --manifest-path tests/reference-oracle/Cargo.toml --bin bme68x-reference-oracle
      - name: Bosch v4.4.8 floating-point differential oracle
        run: cargo run --release --manifest-path tests/reference-oracle/Cargo.toml --bin float_oracle

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Minimum supported Rust
        run: cargo check --all-features
